appId: io.github.auyecoding.radish-security-notes
productName: radish-security-notes
directories:
  buildResources: build
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
# 打包时由 electron-builder 调用 @electron/fuses 翻转 Electron 熔丝: 关闭 ELECTRON_RUN_AS_NODE, Node 调试器参数
# 与 NODE_OPTIONS 三个调试入口, 只从 asar 加载应用代码并校验 asar 的完整性. 块内只写 "键: 布尔" 平铺行,
# src/main/build-config/electron-fuses.test.ts 按这个形状读取并逐键断言.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  executableName: radish-security-notes
  # 一次打出两个产物: 向导式安装包与免安装的便携版.
  target:
    - nsis
    - portable
  # 平台专属的 files 只有排除项时会重新加入 "**/*", 所以重复写出白名单.
  files:
    - out/**
    - resources/**
    - "!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin-arm64,darwin-x64,linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,win32-arm64}.node"
# 向导式安装包: 关闭一键安装, 安装时可以选择安装路径. allowToChangeInstallationDirectory 只对向导式安装包有效,
# 与 oneClick: false 必须一起写, 否则打包报配置错误. src/main/build-config/nsis-installer.test.ts 断言这两行.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# 便携版: 单个免安装的可执行文件, 不写注册表, 不建快捷方式. 数据仍在 Electron 用户数据目录, 与安装版共用.
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
